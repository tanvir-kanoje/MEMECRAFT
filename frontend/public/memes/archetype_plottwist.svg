<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="pt-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#28261F" />
      <stop offset="100%" stop-color="#141311" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#pt-glow)" />

  <!-- Archival Framing Border -->
  <rect x="24" y="24" width="752" height="752" fill="none" stroke="#77796D" stroke-opacity="0.25" stroke-width="1.5" />
  <rect x="36" y="36" width="728" height="728" fill="none" stroke="#77796D" stroke-opacity="0.15" stroke-dasharray="4 6" stroke-width="1" />

  <!-- Taxonomy Metadata Stamps -->
  <text x="56" y="74" fill="#D6FF61" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3" font-weight="600">ARCHIVE SPECIMEN // NO. 052</text>
  <text x="744" y="74" text-anchor="end" fill="#77796D" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2">EMOTION: SURPRISED / SHOCKED</text>

  <!-- Dramatic Shockwave Radii -->
  <g stroke="#D6FF61" stroke-opacity="0.2" stroke-width="1.5" fill="none">
    <circle cx="400" cy="380" r="160" stroke-dasharray="6 8" />
    <circle cx="400" cy="380" r="230" stroke-dasharray="4 12" stroke-opacity="0.15" />
    <circle cx="400" cy="380" r="300" stroke-dasharray="2 16" stroke-opacity="0.1" />
  </g>

  <!-- Central Silhouette: The Plot Twist Stunned Countenance -->
  <g transform="translate(400, 410)">
    <!-- Aura glow -->
    <circle cx="0" cy="-40" r="140" fill="#D6FF61" fill-opacity="0.05" filter="blur(30px)" />

    <!-- Shoulders / Torso -->
    <path d="M -170 240 Q -140 140 -70 120 L 70 120 Q 140 140 170 240 Z" fill="#1C1D18" stroke="#77796D" stroke-opacity="0.4" stroke-width="2" />

    <!-- Neck -->
    <path d="M -36 120 L -32 50 L 32 50 L 36 120 Z" fill="#252620" />

    <!-- Head / Cranium -->
    <ellipse cx="0" cy="-30" rx="85" ry="95" fill="#2B2C24" stroke="#77796D" stroke-width="2" />

    <!-- Hair standing slightly on end in surprise -->
    <path d="M -80 -70 Q -90 -130 -40 -120 Q 0 -140 40 -120 Q 90 -130 80 -70 Z" fill="#171813" />

    <!-- Highly Raised Eyebrows (Stretched upwards) -->
    <path d="M -54 -75 Q -34 -95 -14 -75" fill="none" stroke="#D6FF61" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 14 -75 Q 34 -95 54 -75" fill="none" stroke="#D6FF61" stroke-width="3.5" stroke-linecap="round" />

    <!-- Giant Wide Shocked Eyes -->
    <circle cx="-34" cy="-40" r="22" fill="#F5F1E8" stroke="#171813" stroke-width="2" />
    <circle cx="-34" cy="-40" r="9" fill="#171813" />
    <circle cx="-31" cy="-44" r="3.5" fill="#D6FF61" />

    <circle cx="34" cy="-40" r="22" fill="#F5F1E8" stroke="#171813" stroke-width="2" />
    <circle cx="34" cy="-40" r="9" fill="#171813" />
    <circle cx="37" cy="-44" r="3.5" fill="#D6FF61" />

    <!-- Nose -->
    <path d="M 0 -25 L -4 10 L 6 12" fill="none" stroke="#77796D" stroke-width="2" stroke-linecap="round" />

    <!-- O-Shaped Jaw-Drop Open Mouth (MouthOpen: true) -->
    <ellipse cx="0" cy="46" rx="22" ry="30" fill="#151612" stroke="#D6FF61" stroke-width="3" />
    <path d="M -12 60 Q 0 52 12 60" fill="#E5A93C" fill-opacity="0.3" />

    <!-- Hands to Cheeks (Iconic Screamer / Shock Pose) -->
    <path d="M -90 60 C -110 30, -100 -10, -75 -15 C -65 -15, -60 -5, -65 10 C -70 25, -70 45, -65 65 Z" fill="#32342A" stroke="#77796D" stroke-width="1.5" />
    <path d="M 90 60 C 110 30, 100 -10, 75 -15 C 65 -15, 60 -5, 65 10 C 70 25, 70 45, 65 65 Z" fill="#32342A" stroke="#77796D" stroke-width="1.5" />
  </g>

  <!-- Bottom Archival Stamp -->
  <g transform="translate(56, 700)">
    <rect x="0" y="0" width="688" height="48" rx="6" fill="#181813" stroke="#77796D" stroke-opacity="0.3" stroke-width="1" />
    <text x="20" y="30" fill="#F5F1E8" font-family="'Instrument Serif', Georgia, serif" font-size="20" font-style="italic">The Plot Twist</text>
    <text x="150" y="29" fill="#77796D" font-family="'JetBrains Mono', monospace" font-size="11">“When reality writes a script no one asked for.”</text>
    <text x="668" y="29" text-anchor="end" fill="#D6FF61" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">MEMECRAFT HISTORIC ARCHIVE</text>
  </g>
</svg>

