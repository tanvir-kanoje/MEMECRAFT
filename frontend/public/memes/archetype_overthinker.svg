<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="ot-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#262922" />
      <stop offset="100%" stop-color="#141512" />
    </radialGradient>
    <linearGradient id="ot-lime-fade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6FF61" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D6FF61" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#ot-glow)" />

  <!-- Archival Framing Border -->
  <rect x="24" y="24" width="752" height="752" fill="none" stroke="#77796D" stroke-opacity="0.25" stroke-width="1.5" />
  <rect x="36" y="36" width="728" height="728" fill="none" stroke="#77796D" stroke-opacity="0.15" stroke-dasharray="4 6" stroke-width="1" />

  <!-- Taxonomy Metadata Stamps -->
  <text x="56" y="74" fill="#D6FF61" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3" font-weight="600">ARCHIVE SPECIMEN // NO. 014</text>
  <text x="744" y="74" text-anchor="end" fill="#77796D" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2">EMOTION: CONFUSED / OVERTHINKING</text>

  <!-- Complex Thought Equations / Orbiting Formula Lines -->
  <g stroke="#77796D" stroke-opacity="0.3" stroke-width="1" fill="none">
    <ellipse cx="400" cy="380" rx="260" ry="210" stroke-dasharray="6 8" />
    <ellipse cx="400" cy="380" rx="310" ry="140" transform="rotate(-15 400 380)" stroke-dasharray="4 10" />
    <circle cx="400" cy="380" r="190" stroke-opacity="0.2" />
  </g>

  <!-- Formula Callouts -->
  <text x="140" y="240" fill="#77796D" font-family="'JetBrains Mono', monospace" font-size="13" font-style="italic">lim(thoughts → ∞)</text>
  <text x="610" y="260" fill="#77796D" font-family="'JetBrains Mono', monospace" font-size="13">Δt = -0.04s</text>
  <text x="160" y="520" fill="#77796D" font-family="'JetBrains Mono', monospace" font-size="13">P(scenario) = 0.0001%</text>
  <text x="580" y="530" fill="#D6FF61" font-family="'JetBrains Mono', monospace" font-size="13">CONFIDENCE 96%</text>

  <!-- Central Silhouette: The Overthinker Portrait -->
  <g transform="translate(400, 420)">
    <!-- Aura glow -->
    <circle cx="0" cy="-60" r="140" fill="#D6FF61" fill-opacity="0.04" filter="blur(30px)" />

    <!-- Shoulders & Torso -->
    <path d="M -180 240 Q -150 140 -80 120 L 80 120 Q 150 140 180 240 Z" fill="#1C1E18" stroke="#77796D" stroke-opacity="0.4" stroke-width="2" />

    <!-- Neck & Throat -->
    <path d="M -40 120 L -36 50 L 36 50 L 40 120 Z" fill="#242721" />

    <!-- Head / Cranium -->
    <path d="M -85 -30 C -85 -140, 85 -140, 85 -30 C 85 45, 45 95, 0 100 C -45 95, -85 45, -85 -30 Z" fill="#2A2D25" stroke="#77796D" stroke-width="2" />

    <!-- Hair Silhouette -->
    <path d="M -90 -30 C -92 -150, 92 -150, 90 -30 C 70 -60, 40 -80, 0 -80 C -40 -80, -70 -60, -90 -30 Z" fill="#181A15" />

    <!-- Overthinking Eyebrows (Knitted, Furrowed) -->
    <path d="M -50 -35 L -20 -28" stroke="#D6FF61" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 50 -35 L 20 -28" stroke="#D6FF61" stroke-width="3.5" stroke-linecap="round" />

    <!-- Wide Gaze / Upward Looking Eyes -->
    <ellipse cx="-35" cy="-15" rx="14" ry="11" fill="#F5F1E8" stroke="#181A15" stroke-width="2" />
    <circle cx="-35" cy="-19" r="6" fill="#181A15" />
    <circle cx="-33" cy="-21" r="2" fill="#D6FF61" />

    <ellipse cx="35" cy="-15" rx="14" ry="11" fill="#F5F1E8" stroke="#181A15" stroke-width="2" />
    <circle cx="35" cy="-19" r="6" fill="#181A15" />
    <circle cx="37" cy="-21" r="2" fill="#D6FF61" />

    <!-- Eyeglasses (Intellectual Overthinker Frames) -->
    <rect x="-56" y="-30" width="42" height="32" rx="8" fill="none" stroke="#D6FF61" stroke-width="2.5" />
    <rect x="14" y="-30" width="42" height="32" rx="8" fill="none" stroke="#D6FF61" stroke-width="2.5" />
    <line x1="-14" y1="-14" x2="14" y2="-14" stroke="#D6FF61" stroke-width="2.5" />

    <!-- Nose -->
    <path d="M 0 -10 L -4 20 L 8 22" fill="none" stroke="#77796D" stroke-width="2" stroke-linecap="round" />

    <!-- Pensive Pressed Mouth -->
    <path d="M -22 55 Q 0 50 22 52" fill="none" stroke="#F5F1E8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Hand on Temple / Chin (Classic Pensive Pose) -->
    <path d="M 75 140 C 95 90, 85 40, 70 20 C 65 15, 60 20, 62 30 C 65 45, 60 70, 45 90 Z" fill="#30352A" stroke="#77796D" stroke-width="1.5" />
    <circle cx="70" cy="18" r="6" fill="#D6FF61" />
  </g>

  <!-- Bottom Archival Stamp -->
  <g transform="translate(56, 700)">
    <rect x="0" y="0" width="688" height="48" rx="6" fill="#181A14" stroke="#77796D" stroke-opacity="0.3" stroke-width="1" />
    <text x="20" y="30" fill="#F5F1E8" font-family="'Instrument Serif', Georgia, serif" font-size="20" font-style="italic">The Overthinker</text>
    <text x="175" y="29" fill="#77796D" font-family="'JetBrains Mono', monospace" font-size="11">“Processing 47 hypothetical timelines simultaneously.”</text>
    <text x="668" y="29" text-anchor="end" fill="#D6FF61" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">MEMECRAFT HISTORIC ARCHIVE</text>
  </g>
</svg>

